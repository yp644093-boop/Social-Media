<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks - SocialHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo">🌐 SocialHub</a>
      <div class="nav-center"></div>
      <div class="nav-right">
        <button class="nav-icon" onclick="window.location.href='index.html'">🏠</button>
        <button class="nav-icon">🔔</button>
        <button class="nav-icon">💬</button>
        <button class="nav-icon" onclick="Utils.toggleDarkMode()">🌙</button>
        <div id="user-div">
          <img id="user-avatar-nav" class="user-avatar-nav" alt="User">
          <button class="nav-icon" onclick="Auth.logout()">🚪</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-container">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <li><a href="index.html">🏠 Home</a></li>
        <li><a href="explore.html">🔍 Explore</a></li>
        <li><a href="messages.html">💬 Messages</a></li>
        <li><a href="bookmarks.html" class="active">🔖 Bookmarks</a></li>
      </nav>
    </aside>

    <main class="feed">
      <div class="feed-header">
        <h2>Bookmarks</h2>
      </div>
      <div style="padding: 3rem; text-align: center;">
        <h3 style="color: var(--text-secondary);">🔖 No Bookmarks Yet</h3>
        <p style="color: var(--text-secondary); margin-top: 1rem;">Save posts to view them later</p>
      </div>
    </main>
  </div>

  <script src="js/database.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
