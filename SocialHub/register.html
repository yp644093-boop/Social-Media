<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - SocialHub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div style="display: flex; height: 100vh;">
    <!-- Left side -->
    <div style="flex: 1; background: linear-gradient(135deg, #1da1f2 0%, #1a91da 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; padding: 2rem;">
      <div style="text-align: center;">
        <h1 style="font-size: 3rem; margin-bottom: 1rem;">SocialHub</h1>
        <p style="font-size: 1.5rem; opacity: 0.9;">Share your thoughts with the world</p>
      </div>
    </div>

    <!-- Right side -->
    <div style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; overflow-y: auto;">
      <div style="width: 100%; max-width: 350px;">
        <h2 style="margin-bottom: 2rem; text-align: center;">Create Account</h2>

        <form id="register-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; margin-bottom: 1rem;">
            Create Account
          </button>
        </form>

        <p style="text-align: center; color: var(--text-secondary);">
          Already have an account? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/database.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        Utils.showNotification('Passwords do not match', 'error');
        return;
      }

      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        await SocialAPI.register(name, email, password, username);
        window.location.href = 'index.html';
      } catch (error) {
        Utils.showNotification(error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
