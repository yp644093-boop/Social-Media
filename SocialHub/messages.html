<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - SocialHub</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .messages-container {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100vh - 70px);
      gap: 0;
    }

    .conversations-list {
      border-right: 1px solid var(--border);
      overflow-y: auto;
    }

    .conversation-item {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
    }

    .conversation-item:hover {
      background-color: var(--bg-secondary);
    }

    .conversation-item.active {
      background-color: var(--bg-secondary);
      border-left: 4px solid var(--primary);
    }

    .conversation-user {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .conversation-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .conversation-info {
      flex: 1;
      min-width: 0;
    }

    .conversation-name {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conversation-preview {
      font-size: 0.85rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 0.25rem;
    }

    .unread-badge {
      background-color: var(--primary);
      color: white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .chat-area {
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .chat-header-user {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .message.sent {
      justify-content: flex-end;
    }

    .message.received {
      justify-content: flex-start;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
    }

    .message-bubble {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: 18px;
      word-wrap: break-word;
    }

    .message.sent .message-bubble {
      background-color: var(--primary);
      color: white;
    }

    .message.received .message-bubble {
      background-color: var(--bg-secondary);
      color: var(--text);
    }

    .message-time {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .chat-input-area {
      padding: 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
    }

    .chat-input {
      flex: 1;
      display: flex;
      gap: 0.5rem;
    }

    .chat-input input {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      background-color: var(--bg-secondary);
      color: var(--text);
      font-family: inherit;
    }

    .chat-input input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .chat-input button {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background-color: var(--primary);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .chat-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      text-align: center;
    }

    @media (max-width: 768px) {
      .messages-container {
        grid-template-columns: 1fr;
      }

      .conversations-list {
        display: none;
      }

      .chat-area {
        height: 100%;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo">🌐 SocialHub</a>
      <div class="nav-center"></div>
      <div class="nav-right">
        <button class="nav-icon" onclick="window.location.href='index.html'">🏠</button>
        <button class="nav-icon">🔔</button>
        <button class="nav-icon" style="color: var(--primary);">💬</button>
        <button class="nav-icon" onclick="Utils.toggleDarkMode()">🌙</button>
        <div id="user-div">
          <img id="user-avatar-nav" class="user-avatar-nav" alt="User">
          <button class="nav-icon" onclick="Auth.logout()">🚪</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="messages-container">
    <div class="conversations-list" id="conversations-list">
      <div class="spinner" style="margin: 2rem;"></div>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="chat-placeholder">
        <p>Select a conversation to start messaging</p>
      </div>
    </div>
  </div>

  <script src="js/database.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>

  <script>
    let currentUser;
    let selectedUserId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      Auth.requireLogin();
      currentUser = Auth.getCurrentUser();
      await loadConversations();
    });

    async function loadConversations() {
      const container = document.getElementById('conversations-list');
      try {
        const conversations = await SocialAPI.getConversations(currentUser.id);
        
        if (conversations.length === 0) {
          container.innerHTML = '<p class="text-center text-muted" style="padding: 2rem;">No conversations yet</p>';
          return;
        }

        container.innerHTML = conversations.map(conv => `
          <div class="conversation-item" onclick="openConversation(${conv.userId})">
            <div class="conversation-user">
              <img src="${conv.user.avatar}" class="conversation-avatar" alt="${conv.user.name}">
              <div class="conversation-info">
                <div class="conversation-name">${conv.user.name}</div>
                <div class="conversation-preview">${Utils.truncate(conv.lastMessage, 40)}</div>
              </div>
              ${conv.unreadCount > 0 ? `<div class="unread-badge">${conv.unreadCount}</div>` : ''}
            </div>
          </div>
        `).join('');
      } catch (error) {
        container.innerHTML = '<p class="text-center text-muted" style="padding: 2rem;">Error loading conversations</p>';
      }
    }

    async function openConversation(userId) {
      selectedUserId = userId;
      const otherUser = (await SocialAPI.getUser(userId));
      
      const chatArea = document.getElementById('chat-area');
      chatArea.innerHTML = `
        <div class="chat-header">
          <div class="chat-header-user">
            <img src="${otherUser.avatar}" class="conversation-avatar" alt="${otherUser.name}">
            <div>
              <div class="conversation-name">${otherUser.name}</div>
              <div class="conversation-preview">@${otherUser.username}</div>
            </div>
          </div>
        </div>
        <div class="chat-messages" id="messages-container">
          <div class="spinner" style="margin: auto;"></div>
        </div>
        <div class="chat-input-area">
          <div class="chat-input">
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
            <button onclick="sendMessage()">📤</button>
          </div>
        </div>
      `;

      // Load messages
      await loadMessages(userId);

      // Setup send button
      document.getElementById('message-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
      });

      // Scroll to bottom
      setTimeout(() => {
        const container = document.getElementById('messages-container');
        container.scrollTop = container.scrollHeight;
      }, 300);

      // Update conversation list styling
      document.querySelectorAll('.conversation-item').forEach(item => {
        item.classList.remove('active');
      });
      event.target.closest('.conversation-item').classList.add('active');
    }

    async function loadMessages(userId) {
      const container = document.getElementById('messages-container');
      try {
        const messages = await SocialAPI.getConversationMessages(currentUser.id, userId);
        
        container.innerHTML = messages.map(msg => {
          const isSent = msg.senderId === currentUser.id;
          const user = getDatabase().users.find(u => u.id === msg.senderId);
          
          return `
            <div class="message ${isSent ? 'sent' : 'received'}">
              ${!isSent ? `<img src="${user.avatar}" class="message-avatar" alt="">` : ''}
              <div>
                <div class="message-bubble">${Utils.escapeHtml(msg.content)}</div>
                <div class="message-time">${Utils.formatTime(msg.timestamp)}</div>
              </div>
            </div>
          `;
        }).join('');

        // Scroll to bottom
        setTimeout(() => {
          container.scrollTop = container.scrollHeight;
        }, 100);
      } catch (error) {
        container.innerHTML = '<p class="text-center text-muted">Error loading messages</p>';
      }
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const message = input.value.trim();

      if (!message || !selectedUserId) return;

      try {
        await SocialAPI.sendMessage(currentUser.id, selectedUserId, message);
        input.value = '';
        await loadMessages(selectedUserId);
        await loadConversations();
      } catch (error) {
        Utils.showNotification(error.message, 'error');
      }
    }
  </script>
</body>
</html>
